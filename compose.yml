services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d payment_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/payment_gateway
      DATABASE_USERNAME: gateway
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      REDIS_HOST: redis
      BANK_WEBHOOK_URL: http://localhost:8080/api/v1/webhooks/fake-bank
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET:-local-only-change-me}
      BANK_SIMULATOR_FAIL_REQUESTS: ${BANK_SIMULATOR_FAIL_REQUESTS:-false}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
